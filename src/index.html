<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Haunted House — Starter</title>

  <!-- XRExtras: loading screen, full-window canvas, error handling. -->
  <script src="./external/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine. "slam" chunk enables world tracking / plane detection. -->
  <script async src="./external/xr/xr.js" data-preload-chunks="slam"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #000;
    }
    #camerafeed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #hint {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      color: #eee;
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      opacity: 0.85;
      text-shadow: 0 0 6px #000;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="hint">Move your phone slowly to scan the room, then tap a surface to place a prop</div>
</body>
</html>
