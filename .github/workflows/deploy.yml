name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Assets (3D models, textures) are uploaded to the repo as a single
      # zip (assets.zip at the repo root) since mobile GitHub's web upload
      # UI can't reliably create nested folders. This unpacks it into
      # src/assets/ right before the build, overwriting whatever's there.
      # If assets.zip isn't present, this step just does nothing — no
      # error — so it's safe to leave in permanently.
      - name: Unpack assets.zip if present
        run: |
          if [ -f assets.zip ]; then
            unzip -o assets.zip -d src/assets
          fi

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
